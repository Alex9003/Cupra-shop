<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід в систему</title>
    <link rel="stylesheet" href="/static/css/style_login.css">
</head>
<body>
    <div class="login-container">
        <h1 class="login-title">Вхід в систему</h1>
        
        <form action="login" method="post">
            <div class="input-group">
                <label for="email">Електронна пошта:</label>
                <input type="email" id="email" name="email" placeholder="Введіть вашу email адресу" required>
            </div>
            
            <div class="input-group">
                <label for="password">Пароль:</label>
                <input type="password" id="password" name="password" placeholder="Введіть ваш пароль" required>
            </div>
            
            <button type="submit" class="login-btn">Увійти</button>
        </form>

        <!-- Додаткові посилання -->
        <div class="login-links">
            <a href="/forgot-password">Забули пароль?</a> | 
            <a href="/register">Реєстрація</a>
        </div>

        <!-- Повідомлення про успішний вхід -->
        {% if user %}
        <div class="welcome-message">
            <p>Ласкаво просимо, {{ user | safe }}!</p>
        </div>
        {% endif %}
    </div>
</body>
</html>
